services:

  # Local ECR simulation
  registry:
    image: registry:2
    container_name: project15-ecr
    restart: unless-stopped
    ports:
      - "5000:5000"

  # ECS task simulation
  app:
    build:
      context: ./app
    container_name: project15-ecs
    restart: unless-stopped
    environment:
      ENVIRONMENT: ecs-local
    expose:
      - "5000"

  # Application Load Balancer simulation
  alb:
    image: nginx:alpine
    container_name: project15-alb
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
